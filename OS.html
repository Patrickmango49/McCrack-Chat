<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>McCrack COS</title>
  <style>
    :root{--bg:#050607;--panel:rgba(20,22,28,.78);--panel2:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.22);--text:#f6f7fb;--muted:#a5abb8;--dim:#737987;--brand:#fff;--ok:#61d394;--warn:#ffd166;--bad:#ff6b6b;--shadow:0 28px 80px rgba(0,0,0,.55);--r:22px;--r2:14px;--ease:180ms ease}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:radial-gradient(circle at 12% 10%,#333846,transparent 34%),radial-gradient(circle at 88% 85%,#202737,transparent 30%),linear-gradient(135deg,#020304,#11131a 48%,#06070a);color:var(--text);font-family:Inter,Segoe UI,Roboto,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    #boot{position:fixed;inset:0;display:grid;place-items:center;background:#020304;z-index:20;transition:opacity .45s ease}.boot-card{width:min(460px,88vw);padding:34px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));box-shadow:var(--shadow);text-align:center}.logo{font-size:30px;font-weight:900;letter-spacing:1px}.loader{height:5px;margin-top:24px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}.loader:before{content:"";display:block;width:42%;height:100%;border-radius:inherit;background:#fff;animation:load 1.1s infinite alternate}@keyframes load{to{transform:translateX(145%)}}
    #desktop{height:100%;padding:24px;display:grid;grid-template-rows:auto 1fr auto;gap:18px}.topbar,.dock,.panel{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(18px);box-shadow:var(--shadow)}.topbar{display:flex;align-items:center;justify-content:space-between;border-radius:24px;padding:14px 18px}.brand{display:flex;gap:12px;align-items:center;font-weight:900}.orb{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#fff,#aeb5c6);box-shadow:0 0 30px rgba(255,255,255,.12)}.global-search{width:min(420px,42vw);border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.22);color:var(--text);padding:11px 16px;outline:0}.global-search:focus,.store-search:focus,.focusable:focus-visible{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.16);outline:0}.workspace{display:grid;grid-template-columns:260px 1fr;gap:18px;min-height:0}.side{padding:18px;border-radius:var(--r);display:flex;flex-direction:column;gap:10px}.nav-btn{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:15px;padding:13px 14px;text-align:left;font-weight:800;transition:all var(--ease)}.nav-btn:hover,.nav-btn.active{background:var(--panel2);border-color:var(--line);color:var(--text)}.count{float:right;color:var(--dim)}.main{border-radius:var(--r);padding:22px;min-width:0;overflow:auto}.view-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:18px}.view-title{font-size:28px;font-weight:950}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.035));overflow:hidden;min-height:226px;text-align:left;color:var(--text);transition:transform var(--ease),border-color var(--ease),background var(--ease);position:relative}.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--line2);background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.045))}.poster{height:116px;background:linear-gradient(135deg,#343947,#141720);display:grid;place-items:center;font-size:44px}.card-body{padding:12px}.card-title{font-weight:900;margin-bottom:6px}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase}.desc{margin-top:8px;color:var(--muted);font-size:12px;line-height:1.35}.installed-badge{position:absolute;right:10px;top:10px;background:rgba(97,211,148,.18);border-color:rgba(97,211,148,.35);color:#baf3d1}.dock{border-radius:24px;padding:12px;display:flex;gap:10px;justify-content:center}.dock button,.primary,.secondary,.danger{border-radius:14px;padding:11px 15px;border:1px solid var(--line);font-weight:900;color:var(--text);background:var(--panel2)}.primary{background:#fff;color:#050607;border-color:#fff}.danger{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.3);color:#ffd0d0}.secondary:hover,.dock button:hover{border-color:var(--line2)}
    .store-shell{position:fixed;inset:18px;z-index:10;border:1px solid var(--line);border-radius:30px;background:linear-gradient(180deg,rgba(15,17,23,.96),rgba(7,8,12,.96));box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}.store-header{padding:18px 20px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}.store-title{font-size:24px;font-weight:950}.store-search{width:100%;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.06);color:var(--text);padding:12px 16px;outline:0}.close{width:44px;height:44px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);font-size:20px}.store-tabs{display:flex;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);overflow:auto}.tab{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);border-radius:999px;padding:10px 15px;font-weight:900}.tab.active{background:#fff;color:#050607;border-color:#fff}.store-content{display:grid;grid-template-columns:1fr 360px;gap:18px;padding:18px;min-height:0;flex:1}.store-list{overflow:auto;padding-right:3px}.details{border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.045);padding:18px;min-height:0;align-self:start}.details .poster{height:180px;border-radius:18px;margin-bottom:14px}.details h2{margin:8px 0}.detail-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.empty{border:1px dashed var(--line2);border-radius:20px;padding:30px;text-align:center;color:var(--muted);grid-column:1/-1}.toast-wrap{position:fixed;right:22px;bottom:22px;z-index:30;display:flex;flex-direction:column;gap:10px}.toast{border:1px solid var(--line);background:rgba(20,22,28,.96);border-radius:15px;padding:12px 14px;box-shadow:var(--shadow);animation:toast .25s ease}@keyframes toast{from{opacity:0;transform:translateY(8px)}}.guide{position:fixed;inset:auto 22px 86px auto;width:min(320px,90vw);z-index:16;padding:16px;border:1px solid var(--line);border-radius:22px;background:rgba(10,12,17,.95);box-shadow:var(--shadow)}.embed{position:fixed;inset:0;z-index:25;background:#020304;display:flex;flex-direction:column}.embed-bar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(20,22,28,.94)}iframe{border:0;flex:1;background:#fff}@media(max-width:900px){#desktop{padding:10px}.workspace{grid-template-columns:1fr}.side{flex-direction:row;overflow:auto}.store-shell{inset:0;border-radius:0}.store-header{grid-template-columns:1fr auto}.store-search{grid-column:1/-1;order:3}.store-content{grid-template-columns:1fr}.details{position:relative}.global-search{display:none}.grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}}
  </style>
</head>
<body>
  <div id="boot"><div class="boot-card"><div class="logo">McCrack COS</div><p class="muted">Preparing your libraries…</p><div class="loader"></div></div></div>
  <div id="desktop" aria-label="McCrack COS desktop">
    <header class="topbar"><div class="brand"><div class="orb"></div><div>McCrack COS<br><span class="muted" id="clock">Ready</span></div></div><input id="globalSearch" class="global-search" placeholder="Search installed games, movies, apps…"><button id="guideBtn" class="secondary focusable">Guide</button></header>
    <section class="workspace"><aside class="panel side" id="nav"></aside><main class="panel main"><div class="view-head"><div><div id="viewTitle" class="view-title">Home</div><div id="viewSub" class="muted">Browse your installed content or open the Store.</div></div><button id="openStore" class="primary focusable">Open Store</button></div><div id="contentGrid" class="grid"></div></main></section>
    <footer class="dock"><button class="focusable" data-view="home">Home</button><button class="focusable" data-view="games">Games</button><button class="focusable" data-view="movies">Movies</button><button class="focusable" data-view="apps">Apps</button><button class="focusable" id="storeDock">Store</button></footer>
  </div>
  <section id="store" class="store-shell hidden" aria-label="McCrack Store"><header class="store-header"><div><div class="store-title">McCrack Store</div><div class="muted">Browse → Select → View Details → Download</div></div><input id="storeSearch" class="store-search" placeholder="Search the catalog…"><button id="closeStore" class="close focusable" aria-label="Close Store">×</button></header><nav id="storeTabs" class="store-tabs"></nav><div class="store-content"><div id="storeGrid" class="grid store-list"></div><aside id="storeDetails" class="details"></aside></div></section>
  <div id="guide" class="guide hidden"><h3>Guide Menu</h3><p class="muted">Use arrows/Tab to move, Enter/A to select, Esc/B to go back. Store installs are saved locally.</p><button id="resumeBtn" class="primary focusable">Resume</button></div>
  <div id="embed" class="embed hidden"><div class="embed-bar"><strong id="embedTitle">Launching…</strong><button id="closeEmbed" class="secondary focusable">Close</button></div><iframe id="embedFrame" title="Content embed"></iframe></div>
  <div id="toasts" class="toast-wrap"></div>
<script>
const STORE_CATALOG=[
{id:'retro-racer',title:'Retro Racer',category:'games',icon:'🏎️',description:'Fast arcade racing with neon tracks.',url:'https://example.com'},
{id:'block-builder',title:'Block Builder',category:'games',icon:'🧱',description:'A creative sandbox for building worlds.',url:'https://example.com'},
{id:'space-pilot',title:'Space Pilot',category:'games',icon:'🚀',description:'Pilot through asteroid fields and deep-space missions.',url:'https://example.com'},
{id:'puzzle-vault',title:'Puzzle Vault',category:'games',icon:'🧩',description:'Compact logic puzzles for quick play sessions.',url:'https://example.com'},
{id:'cos-trailer',title:'McCrack COS Trailer',category:'movies',icon:'🎬',description:'A showcase reel for the McCrack experience.',url:'https://www.youtube.com/embed/dQw4w9WgXcQ'},
{id:'space-doc',title:'Into the Static',category:'movies',icon:'🌌',description:'A short sci-fi feature about signals beyond orbit.',url:'https://example.com'},
{id:'pixel-film',title:'Pixel Hearts',category:'movies',icon:'🍿',description:'An animated short with retro style.',url:'https://example.com'},
{id:'notes',title:'Notes',category:'apps',icon:'📝',description:'A lightweight place for thoughts and plans.',url:'about:blank'},
{id:'calculator',title:'Calculator',category:'apps',icon:'🧮',description:'Quick calculations in a clean app shell.',url:'about:blank'},
{id:'radio',title:'McCrack Radio',category:'apps',icon:'📻',description:'A simple embedded radio dashboard.',url:'https://example.com'}
];
const STORAGE_KEY='mccrack.cos.installed.v1',FAV_KEY='mccrack.cos.favorites.v1',PIN_KEY='mccrack.cos.pins.v1';
const cats=['all','games','movies','apps'];let state={view:'home',storeCat:'all',storeQuery:'',selectedId:STORE_CATALOG[0].id,installed:loadSet(STORAGE_KEY),favorites:loadSet(FAV_KEY),pins:loadSet(PIN_KEY)};
const $=id=>document.getElementById(id);function loadSet(k){return new Set(JSON.parse(localStorage.getItem(k)||'[]'))}function saveSet(k,s){localStorage.setItem(k,JSON.stringify([...s]))}function item(id){return STORE_CATALOG.find(x=>x.id===id)}function installedItems(){return STORE_CATALOG.filter(x=>state.installed.has(x.id))}function toast(msg,type=''){const t=document.createElement('div');t.className='toast';t.textContent=msg;$('toasts').append(t);setTimeout(()=>t.remove(),2600)}function label(c){return c==='apps'?'Apps':c[0].toUpperCase()+c.slice(1)}
function install(id){const it=item(id);if(!it||!cats.includes(it.category)){toast('Something went wrong','bad');return}if(state.installed.has(id)){toast('Already installed');return}state.installed.add(id);saveSet(STORAGE_KEY,state.installed);toast(`${it.title} installed successfully`);renderAll();selectDetails(id)}
function uninstall(id){const it=item(id);if(!it)return;state.installed.delete(id);state.favorites.delete(id);state.pins.delete(id);saveSet(STORAGE_KEY,state.installed);saveSet(FAV_KEY,state.favorites);saveSet(PIN_KEY,state.pins);toast('Removed from library');renderAll();selectDetails(id)}
function toggle(set,key,id,msg){if(!state.installed.has(id)){toast('Install it first');return}set.has(id)?set.delete(id):set.add(id);saveSet(key,set);toast(msg);renderAll()}
function renderNav(){const counts={games:0,movies:0,apps:0};installedItems().forEach(x=>counts[x.category]++);$('nav').innerHTML=['home','games','movies','apps','favorites','pinned'].map(v=>`<button class="nav-btn focusable ${state.view===v?'active':''}" data-view="${v}">${label(v)} ${counts[v]!==undefined?`<span class="count">${counts[v]}</span>`:''}</button>`).join('')}
function renderLibrary(){const q=$('globalSearch').value.trim().toLowerCase();let list=installedItems();if(['games','movies','apps'].includes(state.view))list=list.filter(x=>x.category===state.view);if(state.view==='favorites')list=list.filter(x=>state.favorites.has(x.id));if(state.view==='pinned')list=list.filter(x=>state.pins.has(x.id));if(q)list=list.filter(x=>(x.title+x.description+label(x.category)).toLowerCase().includes(q));$('viewTitle').textContent=label(state.view);$('viewSub').textContent=state.view==='home'?'Installed and pinned content appears here. Open the Store to add more.':'Your installed '+label(state.view).toLowerCase()+'.';$('contentGrid').innerHTML=list.length?list.map(card).join(''):`<div class="empty">Nothing here yet. Open the Store to download content.</div>`}
function card(x,store=false){const ins=state.installed.has(x.id);return `<button class="card focusable" data-id="${x.id}" data-store="${store}">${ins&&store?'<span class="pill installed-badge">Installed ✓</span>':''}<div class="poster">${x.icon}</div><div class="card-body"><div class="card-title">${x.title}</div><span class="pill">${label(x.category)}</span><p class="desc">${x.description}</p></div></button>`}
function renderStore(){$('storeTabs').innerHTML=cats.map(c=>`<button class="tab focusable ${state.storeCat===c?'active':''}" data-cat="${c}">${label(c)}</button>`).join('');let list=STORE_CATALOG.filter(x=>(state.storeCat==='all'||x.category===state.storeCat));const q=state.storeQuery.toLowerCase();if(q)list=list.filter(x=>(x.title+x.description+label(x.category)).toLowerCase().includes(q));$('storeGrid').innerHTML=list.length?list.map(x=>card(x,true)).join(''):'<div class="empty">No catalog items match your search.</div>';selectDetails(state.selectedId)}
function selectDetails(id){const it=item(id)||STORE_CATALOG[0];state.selectedId=it.id;const ins=state.installed.has(it.id);$('storeDetails').innerHTML=`<div class="poster">${it.icon}</div><span class="pill">${label(it.category)}</span><h2>${it.title}</h2><p class="muted">${it.description}</p><div class="detail-actions"><button class="${ins?'secondary':'primary'} focusable" id="installBtn">${ins?'Installed ✓':'Download / Install'}</button>${ins?`<button class="secondary focusable" id="launchBtn">Launch</button><button class="secondary focusable" id="favBtn">${state.favorites.has(it.id)?'Unfavorite':'Favorite'}</button><button class="secondary focusable" id="pinBtn">${state.pins.has(it.id)?'Unpin':'Pin'}</button><button class="danger focusable" id="removeBtn">Uninstall</button>`:''}</div>`;$('installBtn').onclick=()=>install(it.id);if(ins){$('launchBtn').onclick=()=>launch(it.id);$('favBtn').onclick=()=>toggle(state.favorites,FAV_KEY,it.id,'Favorites updated');$('pinBtn').onclick=()=>toggle(state.pins,PIN_KEY,it.id,'Pins updated');$('removeBtn').onclick=()=>uninstall(it.id)}}
function renderAll(){renderNav();renderLibrary();renderStore()}function launch(id){const it=item(id);if(!it||!state.installed.has(id)){toast('Install it first');return}$('embedTitle').textContent=it.title;$('embedFrame').src=it.url;$('embed').classList.remove('hidden')}function setView(v){state.view=v;renderAll()}function openStore(){state.selectedId=state.selectedId||STORE_CATALOG[0].id;$('store').classList.remove('hidden');renderStore();$('storeSearch').focus()}function closeStore(){$('store').classList.add('hidden')}
document.addEventListener('click',e=>{const view=e.target.closest('[data-view]');if(view)setView(view.dataset.view);const st=e.target.closest('[data-store="true"]');if(st)selectDetails(st.dataset.id);const lib=e.target.closest('.card[data-store="false"]');if(lib){state.selectedId=lib.dataset.id;openStore();selectDetails(lib.dataset.id)}});$('openStore').onclick=openStore;$('storeDock').onclick=openStore;$('closeStore').onclick=closeStore;$('storeSearch').oninput=e=>{state.storeQuery=e.target.value;renderStore()};$('globalSearch').oninput=renderLibrary;$('storeTabs').onclick=e=>{const b=e.target.closest('[data-cat]');if(b){state.storeCat=b.dataset.cat;renderStore()}};$('guideBtn').onclick=()=>$('guide').classList.toggle('hidden');$('resumeBtn').onclick=()=>$('guide').classList.add('hidden');$('closeEmbed').onclick=()=>{$('embed').classList.add('hidden');$('embedFrame').src='about:blank'};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('embed').classList.contains('hidden'))$('closeEmbed').click();else if(!$('store').classList.contains('hidden'))closeStore();else $('guide').classList.add('hidden')}if((e.key==='Enter'||e.key===' ')&&document.activeElement?.classList.contains('card'))document.activeElement.click();if(e.key.toLowerCase()==='g')$('guide').classList.toggle('hidden')});setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})},1000);renderAll();setTimeout(()=>{$('boot').style.opacity=0;setTimeout(()=>$('boot').remove(),480)},650);
</script>
</body>
</html>
