<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>McCrack COS</title>
  <style>
    :root{--bg:#050607;--panel:rgba(20,22,28,.78);--panel2:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.22);--text:#f6f7fb;--muted:#a5abb8;--dim:#737987;--brand:#fff;--ok:#61d394;--warn:#ffd166;--bad:#ff6b6b;--shadow:0 28px 80px rgba(0,0,0,.55);--r:22px;--r2:14px;--ease:180ms ease}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:radial-gradient(circle at 12% 10%,#333846,transparent 34%),radial-gradient(circle at 88% 85%,#202737,transparent 30%),linear-gradient(135deg,#020304,#11131a 48%,#06070a);color:var(--text);font-family:Inter,Segoe UI,Roboto,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    #boot{position:fixed;inset:0;display:grid;place-items:center;background:#020304;z-index:20;transition:opacity .45s ease}.boot-card{width:min(460px,88vw);padding:34px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));box-shadow:var(--shadow);text-align:center}.logo{font-size:30px;font-weight:900;letter-spacing:1px}.loader{height:5px;margin-top:24px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}.loader:before{content:"";display:block;width:42%;height:100%;border-radius:inherit;background:#fff;animation:load 1.1s infinite alternate}@keyframes load{to{transform:translateX(145%)}}
    #desktop{height:100%;padding:24px;display:grid;grid-template-rows:auto 1fr auto;gap:18px}.topbar,.dock,.panel{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(18px);box-shadow:var(--shadow)}.topbar{display:flex;align-items:center;justify-content:space-between;border-radius:24px;padding:14px 18px}.brand{display:flex;gap:12px;align-items:center;font-weight:900}.orb{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#fff,#aeb5c6);box-shadow:0 0 30px rgba(255,255,255,.12)}.global-search{width:min(420px,42vw);border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.22);color:var(--text);padding:11px 16px;outline:0}.global-search:focus,.focusable:focus-visible{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.16);outline:0}.workspace{display:grid;grid-template-columns:260px 1fr;gap:18px;min-height:0}.side{padding:18px;border-radius:var(--r);display:flex;flex-direction:column;gap:10px}.nav-btn{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:15px;padding:13px 14px;text-align:left;font-weight:800;transition:all var(--ease)}.nav-btn:hover,.nav-btn.active{background:var(--panel2);border-color:var(--line);color:var(--text)}.count{float:right;color:var(--dim)}.main{border-radius:var(--r);padding:22px;min-width:0;overflow:auto}.view-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:18px}.view-title{font-size:28px;font-weight:950}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.035));overflow:hidden;min-height:226px;text-align:left;color:var(--text);transition:transform var(--ease),border-color var(--ease),background var(--ease);position:relative}.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--line2);background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.045))}.poster{height:116px;background:linear-gradient(135deg,#343947,#141720);display:grid;place-items:center;font-size:44px}.card-body{padding:12px}.card-title{font-weight:900;margin-bottom:6px}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase}.desc{margin-top:8px;color:var(--muted);font-size:12px;line-height:1.35}.dock{border-radius:24px;padding:12px;display:flex;gap:10px;justify-content:center}.dock button,.primary,.secondary,.danger{border-radius:14px;padding:11px 15px;border:1px solid var(--line);font-weight:900;color:var(--text);background:var(--panel2)}.primary{background:#fff;color:#050607;border-color:#fff}.danger{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.3);color:#ffd0d0}.secondary:hover,.dock button:hover{border-color:var(--line2)}
    .empty{border:1px dashed var(--line2);border-radius:20px;padding:30px;text-align:center;color:var(--muted);grid-column:1/-1}.guide{position:fixed;inset:auto 22px 86px auto;width:min(320px,90vw);z-index:16;padding:16px;border:1px solid var(--line);border-radius:22px;background:rgba(10,12,17,.95);box-shadow:var(--shadow)}.embed{position:fixed;inset:0;z-index:25;background:#020304;display:flex;flex-direction:column}.embed-bar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(20,22,28,.94)}iframe{border:0;flex:1;background:#fff}@media(max-width:900px){#desktop{padding:10px}.workspace{grid-template-columns:1fr}.side{flex-direction:row;overflow:auto}.global-search{display:none}.grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}}
  </style>
</head>
<body>
  <div id="boot"><div class="boot-card"><div class="logo">McCrack COS</div><p class="muted">Preparing your libraries…</p><div class="loader"></div></div></div>
  <div id="desktop" aria-label="McCrack COS desktop">
    <header class="topbar"><div class="brand"><div class="orb"></div><div>McCrack COS<br><span class="muted" id="clock">Ready</span></div></div><input id="globalSearch" class="global-search" placeholder="Search games, movies, apps…"><button id="guideBtn" class="secondary focusable">Guide</button></header>
    <section class="workspace"><aside class="panel side" id="nav"></aside><main class="panel main"><div class="view-head"><div><div id="viewTitle" class="view-title">Home</div><div id="viewSub" class="muted">All games, movies, and apps are included in your library.</div></div></div><div id="contentGrid" class="grid"></div></main></section>
    <footer class="dock"><button class="focusable" data-view="home">Home</button><button class="focusable" data-view="games">Games</button><button class="focusable" data-view="movies">Movies</button><button class="focusable" data-view="apps">Apps</button></footer>
  </div>
  <div id="guide" class="guide hidden"><h3>Guide Menu</h3><p class="muted">Use arrows/Tab to move, Enter/A to select, Esc/B to go back. Everything is already available in your library.</p><button id="resumeBtn" class="primary focusable">Resume</button></div>
  <div id="embed" class="embed hidden"><div class="embed-bar"><strong id="embedTitle">Launching…</strong><button id="closeEmbed" class="secondary focusable">Close</button></div><iframe id="embedFrame" title="Content embed"></iframe></div>
<script>
const LIBRARY_ITEMS=[
{id:'retro-racer',title:'Retro Racer',category:'games',icon:'🏎️',description:'Fast arcade racing with neon tracks.',url:'https://example.com'},
{id:'block-builder',title:'Block Builder',category:'games',icon:'🧱',description:'A creative sandbox for building worlds.',url:'https://example.com'},
{id:'space-pilot',title:'Space Pilot',category:'games',icon:'🚀',description:'Pilot through asteroid fields and deep-space missions.',url:'https://example.com'},
{id:'puzzle-vault',title:'Puzzle Vault',category:'games',icon:'🧩',description:'Compact logic puzzles for quick play sessions.',url:'https://example.com'},
{id:'cos-trailer',title:'McCrack COS Trailer',category:'movies',icon:'🎬',description:'A showcase reel for the McCrack experience.',url:'https://www.youtube.com/embed/dQw4w9WgXcQ'},
{id:'space-doc',title:'Into the Static',category:'movies',icon:'🌌',description:'A short sci-fi feature about signals beyond orbit.',url:'https://example.com'},
{id:'pixel-film',title:'Pixel Hearts',category:'movies',icon:'🍿',description:'An animated short with retro style.',url:'https://example.com'},
{id:'notes',title:'Notes',category:'apps',icon:'📝',description:'A lightweight place for thoughts and plans.',url:'about:blank'},
{id:'calculator',title:'Calculator',category:'apps',icon:'🧮',description:'Quick calculations in a clean app shell.',url:'about:blank'},
{id:'radio',title:'McCrack Radio',category:'apps',icon:'📻',description:'A simple embedded radio dashboard.',url:'https://example.com'}
];
let state={view:'home'};
const $=id=>document.getElementById(id);function item(id){return LIBRARY_ITEMS.find(x=>x.id===id)}function label(c){return c==='apps'?'Apps':c[0].toUpperCase()+c.slice(1)}
function renderNav(){const counts={games:0,movies:0,apps:0};LIBRARY_ITEMS.forEach(x=>counts[x.category]++);$('nav').innerHTML=['home','games','movies','apps'].map(v=>`<button class="nav-btn focusable ${state.view===v?'active':''}" data-view="${v}">${label(v)} ${counts[v]!==undefined?`<span class="count">${counts[v]}</span>`:''}</button>`).join('')}
function renderLibrary(){const q=$('globalSearch').value.trim().toLowerCase();let list=[...LIBRARY_ITEMS];if(['games','movies','apps'].includes(state.view))list=list.filter(x=>x.category===state.view);if(q)list=list.filter(x=>(x.title+x.description+label(x.category)).toLowerCase().includes(q));$('viewTitle').textContent=label(state.view);$('viewSub').textContent=state.view==='home'?'All games, movies, and apps are ready to launch.':'All '+label(state.view).toLowerCase()+' included in your library.';$('contentGrid').innerHTML=list.length?list.map(card).join(''):`<div class="empty">No library items match your search.</div>`}
function card(x){return `<button class="card focusable" data-id="${x.id}"><div class="poster">${x.icon}</div><div class="card-body"><div class="card-title">${x.title}</div><span class="pill">${label(x.category)}</span><p class="desc">${x.description}</p></div></button>`}
function renderAll(){renderNav();renderLibrary()}function launch(id){const it=item(id);if(!it)return;$('embedTitle').textContent=it.title;$('embedFrame').src=it.url;$('embed').classList.remove('hidden')}function setView(v){state.view=v;renderAll()}
document.addEventListener('click',e=>{const view=e.target.closest('[data-view]');if(view)setView(view.dataset.view);const lib=e.target.closest('.card[data-id]');if(lib)launch(lib.dataset.id)});$('globalSearch').oninput=renderLibrary;$('guideBtn').onclick=()=>$('guide').classList.toggle('hidden');$('resumeBtn').onclick=()=>$('guide').classList.add('hidden');$('closeEmbed').onclick=()=>{$('embed').classList.add('hidden');$('embedFrame').src='about:blank'};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('embed').classList.contains('hidden'))$('closeEmbed').click();else $('guide').classList.add('hidden')}if((e.key==='Enter'||e.key===' ')&&document.activeElement?.classList.contains('card'))document.activeElement.click();if(e.key.toLowerCase()==='g')$('guide').classList.toggle('hidden')});setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})},1000);renderAll();setTimeout(()=>{$('boot').style.opacity=0;setTimeout(()=>$('boot').remove(),480)},650);
</script>
</body>
</html>
