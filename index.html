<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝕄𝕔ℂ𝕣𝕒𝕔𝕜 Chat</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        :root {
            --bg-0: #060606;
            --bg-1: #0d0d0d;
            --bg-2: #121212;
            --bg-3: #1a1a1a;
            --line-soft: #232323;
            --line-strong: #2c2c2c;
            --text-primary: #f4f4f4;
            --text-muted: #8a8a8a;
            --text-dim: #666;
            --accent: #ffffff;
            --radius-lg: 24px;
            --radius-md: 14px;
            --radius-pill: 999px;
            --shadow-app: 0 45px 100px rgba(0,0,0,0.78);
            --shadow-soft: 0 10px 30px rgba(0,0,0,0.35);
        }

        * { box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI', Roboto, sans-serif; }
        
        /* Global Blurry B&W Gradient Background */
        body, html { 
            width:100%; 
            height:100%; 
            background:
                radial-gradient(circle at 18% 12%, #2e2e2e 0%, transparent 38%),
                radial-gradient(circle at 88% 86%, #1f1f1f 0%, transparent 32%),
                radial-gradient(circle at center, #2b2b2b 0%, #000 70%);
            display:flex; 
            justify-content:center; 
            align-items:center; 
            color: var(--text-primary); 
            overflow: hidden; 
        }
        
        #app { 
            width:98%; 
            max-width:1400px; 
            height:95vh; 
            display:flex; 
            border-radius: var(--radius-lg); 
            overflow:hidden; 
            background: linear-gradient(180deg, rgba(20, 20, 20, 0.95), rgba(14, 14, 14, 0.95));
            box-shadow: var(--shadow-app);
            border: 1px solid var(--line-strong);
            backdrop-filter: blur(14px);
        }
        
        /* Sidebar */
        #sidebar { width:280px; background: linear-gradient(180deg, #0b0b0b 0%, #090909 100%); padding:24px 20px; display:flex; flex-direction:column; gap:14px; border-right: 1px solid var(--line-soft); flex-shrink: 0; }
        
        #sidebar h2 { 
            color: var(--accent); 
            letter-spacing: 2.5px; 
            font-size: 27px; 
            text-align: center; 
            margin-bottom: 8px; 
            font-weight: 900; 
            text-shadow: 0 0 15px rgba(255,255,255,0.18);
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 10px; color: var(--text-dim); font-weight: 700; letter-spacing: 1px; }
        #sidebar input,
        #room-name-input {
            padding: 12px 13px;
            border-radius: 10px;
            border: 1px solid var(--line-strong);
            background: var(--bg-2);
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        #sidebar input:focus,
        #room-name-input:focus,
        #message-input:focus {
            border-color: #4a4a4a;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
        }
        
        #sidebar button { padding:12px; border:1px solid var(--line-strong); border-radius:10px; background:#1c1c1c; color:var(--text-primary); cursor:pointer; font-weight:700; transition: background 0.2s ease, transform 0.15s ease, border-color 0.2s ease; }
        #sidebar button:hover { background:#252525; border-color:#404040; transform: translateY(-1px); }
        #createBtn { background: var(--accent) !important; color: #000 !important; border-color: transparent !important; }
        #createBtn:hover { background: #ececec !important; }

        /* Recent Rooms */
        #recent-rooms-container { margin-top: 26px; display: flex; flex-direction: column; gap: 10px; }
        #recent-rooms-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line-soft); padding-bottom: 6px; }
        #recent-rooms-list { display: flex; flex-direction: column; gap: 6px; }
        .room-history-btn { background: #111 !important; border: 1px solid var(--line-soft) !important; text-align: left !important; font-size: 13px !important; color: var(--text-muted) !important; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.01); }
        .room-history-btn:hover { border-color: #4a4a4a !important; color: var(--text-primary) !important; }

        /* Chat Window */
        #chat-area { flex:1; display:flex; flex-direction:column; background: radial-gradient(circle at top, #090909 0%, #000 64%); }
        #room-header { padding: 20px 30px; background: rgba(11, 11, 11, 0.82); border-bottom: 1px solid var(--line-soft); font-weight: 700; color: var(--accent); font-size: 20px; letter-spacing: 0.9px; backdrop-filter: blur(8px); }
        #chat { flex:1; overflow-y:auto; padding:30px; display:flex; flex-direction:column; gap:12px; }
        #chat::-webkit-scrollbar { width: 10px; }
        #chat::-webkit-scrollbar-track { background: transparent; }
        #chat::-webkit-scrollbar-thumb { background: #1f1f1f; border-radius: 10px; }
        #chat::-webkit-scrollbar-thumb:hover { background: #2b2b2b; }
        
        .message { 
            max-width:75%; padding:12px 18px; border-radius:17px; font-size: 14px; 
            background: linear-gradient(180deg, #1a1a1a, #171717); align-self:flex-start; line-height: 1.5; border: 1px solid var(--line-soft); 
            box-shadow: var(--shadow-soft);
        }
        .mine { background: linear-gradient(180deg, #ffffff, #ebebeb); color: #000; align-self:flex-end; border: none; box-shadow: 0 12px 28px rgba(255,255,255,0.13); }
        .mine .msg-info { color: #444; }
        .msg-info { display:block; font-size:10px; font-weight: 700; margin-bottom: 4px; opacity: 0.62; }

        /* Images in chat */
        .chat-img { max-width: 100%; border-radius: 12px; margin-top: 8px; display: block; border: 1px solid var(--line-strong); cursor: zoom-in; }

        /* Typing Indicator Styling */
        #typing-indicator { 
            padding: 0 30px 5px 30px; 
            font-size: 11px; 
            color: var(--text-dim); 
            height: 18px; 
            font-style: italic; 
            background: var(--bg-0); 
        }

        /* Input Area */
        #input-area { display:flex; padding:20px 24px 22px; background: rgba(10, 10, 10, 0.92); gap: 10px; border-top: 1px solid var(--line-soft); align-items: center; }
        #message-input { flex:1; padding:14px 22px; border-radius: var(--radius-pill); border:1px solid var(--line-strong); background:#070707; color:var(--text-primary); outline: none; transition: border-color 0.2s ease, box-shadow 0.2s ease; }
        
        /* Circular Upload Button */
        .action-btn { 
            width: 45px; height: 45px; border-radius: 50%; border: 1px solid var(--line-strong); 
            background: #111; color: var(--text-primary); cursor: pointer; font-size: 22px; 
            display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.2s ease, border-color 0.2s ease;
        }
        .action-btn:hover { background: #1d1d1d; border-color: #4b4b4b; }
        
        #sendBtn { padding:0 30px; height: 45px; border-radius: var(--radius-pill); border:none; background:var(--accent); color:#000; cursor:pointer; font-weight:700; transition: transform 0.15s ease, background 0.2s ease; }
        #sendBtn:hover:enabled { transform: translateY(-1px); background: #ececec; }
        #sendBtn:disabled,
        .action-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        /* Modals */
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); backdrop-filter: blur(10px); justify-content:center; align-items:center; z-index:1000; }
        .modal-content { background:linear-gradient(180deg, #131313 0%, #0f0f0f 100%); padding:36px; border-radius:24px; width:400px; display:flex; flex-direction:column; gap:18px; border: 1px solid var(--line-strong); text-align: center; box-shadow: var(--shadow-app); }
        .confirm-btn { background:var(--accent); color:#000; padding: 14px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; }
        
        #status-display { margin-top: auto; font-size: 11px; font-weight: bold; letter-spacing: 1px; }
        .status-online { color: #00ff88; }
        .status-offline { color: #ff4444; }

        @media (max-width: 900px) {
            #app { width: 100%; height: 100vh; border-radius: 0; }
            #sidebar { width: 250px; padding: 20px 16px; }
            #chat, #room-header { padding-left: 18px; padding-right: 18px; }
            #input-area { padding: 14px 16px 16px; }
        }

        /* McCrack Chat — polished responsive interface */
        :root {
            color-scheme: dark;
            --bg-0:#08090b; --bg-1:#0d0f12; --bg-2:#13161a; --bg-3:#1a1e23;
            --line-soft:rgba(255,255,255,.075); --line-strong:rgba(255,255,255,.13);
            --text-primary:#f5f6f7; --text-muted:#a0a5ad; --text-dim:#737984;
            --accent:#f5f6f7; --radius-lg:26px; --radius-md:16px;
            --shadow-app:0 35px 100px rgba(0,0,0,.62); --shadow-soft:0 8px 24px rgba(0,0,0,.2);
        }
        * { -webkit-tap-highlight-color:transparent; }
        body,html { min-height:100%; background:
            radial-gradient(ellipse at 12% 8%,rgba(105,113,126,.17),transparent 32%),
            radial-gradient(ellipse at 90% 92%,rgba(68,74,85,.15),transparent 34%),
            #070809; }
        #app { width:min(1500px,96vw); height:min(920px,94vh); border-radius:26px;
            background:rgba(13,15,18,.94); border:1px solid rgba(255,255,255,.11);
            box-shadow:0 35px 110px rgba(0,0,0,.65),0 1px 0 rgba(255,255,255,.04) inset;
            backdrop-filter:blur(24px); }
        #sidebar { width:290px; padding:28px 22px 22px; gap:14px;
            background:linear-gradient(160deg,rgba(25,28,33,.98),rgba(12,14,17,.98));
            border-right:1px solid var(--line-soft); }
        #sidebar h2 { text-align:left; font-size:24px; letter-spacing:-.8px; margin:0 0 14px;
            text-shadow:none; display:flex; align-items:center; gap:10px; }
        #sidebar h2:before { content:""; display:block; width:9px; height:27px; border-radius:8px;
            background:linear-gradient(180deg,#fff,#8f969f); box-shadow:0 0 22px rgba(255,255,255,.18); }
        .input-group { gap:9px; }
        .input-group label,#recent-rooms-header label { color:#858b95!important; font-size:10px; letter-spacing:1.5px; }
        #sidebar input,#room-name-input { width:100%; min-width:0; padding:13px 14px; border-radius:12px;
            background:#0b0d10; border:1px solid var(--line-strong); color:#f7f7f7; }
        #sidebar input:focus,#room-name-input:focus,#message-input:focus { border-color:rgba(255,255,255,.42); box-shadow:0 0 0 4px rgba(255,255,255,.055); }
        #sidebar button { padding:12px 14px; border-radius:12px; background:#1b1f24; border-color:var(--line-strong); }
        #sidebar button:hover { background:#252a31; border-color:rgba(255,255,255,.24); transform:translateY(-1px); }
        #createBtn { box-shadow:0 5px 18px rgba(255,255,255,.08); }
        #recent-rooms-container { margin-top:12px; gap:12px; min-height:0; }
        #recent-rooms-header { padding-bottom:12px; border-bottom-color:var(--line-soft); }
        #recent-rooms-header span { color:#aeb4bd!important; letter-spacing:1px; font-weight:700; }
        .room-history-btn { padding:11px 12px!important; border-radius:11px!important; background:rgba(255,255,255,.025)!important; }
        .room-history-btn:before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:#858b95; margin:0 9px 1px 0; }
        #status-display { display:flex; align-items:center; gap:9px; padding:12px 13px; border:1px solid var(--line-soft);
            border-radius:12px; background:rgba(255,255,255,.025); letter-spacing:.4px; }
        #status-display:before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; box-shadow:0 0 12px currentColor; }
        .status-online { color:#72d6a1!important; } .status-offline { color:#e58a8a!important; }
        #chat-area { min-width:0; background:radial-gradient(ellipse at top right,rgba(255,255,255,.035),transparent 38%),#0b0d10; }
        #room-header { min-height:78px; display:flex; align-items:center; padding:20px 30px;
            background:rgba(15,17,20,.84); border-bottom:1px solid var(--line-soft);
            font-size:18px; letter-spacing:-.25px; }
        #chat { padding:28px clamp(18px,3vw,42px); gap:14px; scroll-behavior:smooth; }
        #chat::-webkit-scrollbar { width:8px; } #chat::-webkit-scrollbar-thumb { background:#30343a; border:2px solid #0b0d10; }
        .message { max-width:min(76%,650px); padding:13px 16px; border-radius:17px 17px 17px 6px;
            background:linear-gradient(145deg,#1b1f24,#15181c); border:1px solid rgba(255,255,255,.075);
            box-shadow:0 5px 18px rgba(0,0,0,.13); overflow-wrap:anywhere; white-space:pre-wrap; }
        .mine { border-radius:17px 17px 6px 17px; background:linear-gradient(145deg,#f7f7f7,#dfe2e6);
            color:#101114; box-shadow:0 8px 22px rgba(0,0,0,.22); }
        .msg-info { color:#b4bac3; opacity:1; font-size:10px; letter-spacing:.35px; text-transform:none; }
        .mine .msg-info { color:#5c626b; }
        .chat-img { max-height:360px; object-fit:contain; background:#08090b; border-radius:12px; }
        #typing-indicator { flex-shrink:0; height:22px; padding:2px 30px 5px; color:#9ca2ac; background:#0b0d10; }
        #input-area { padding:17px 22px 20px; background:rgba(14,16,19,.96); gap:10px; border-top:1px solid var(--line-soft); }
        #message-input { min-width:0; padding:15px 19px; border-radius:15px; background:#090b0e; border-color:var(--line-strong); }
        #message-input::placeholder { color:#747a84; }
        .action-btn { width:46px; height:46px; border-radius:14px; background:#1a1e23; font-size:24px; }
        .action-btn:hover { background:#282d34; border-color:#555c66; }
        #sendBtn { min-width:86px; height:46px; border-radius:14px; padding:0 22px; font-size:13px; box-shadow:0 5px 16px rgba(255,255,255,.07); }
        button,input { font:inherit; } button { -webkit-appearance:none; }
        button:focus-visible,span[onclick]:focus-visible { outline:2px solid #e8ebef; outline-offset:3px; }
        .modal { padding:20px; background:rgba(0,0,0,.72); backdrop-filter:blur(16px); }
        .modal-content { width:min(440px,100%); padding:30px; border-radius:22px; gap:16px;
            background:linear-gradient(145deg,#1b1e23,#101215); border-color:rgba(255,255,255,.13); }
        .modal-content h3 { font-size:23px; letter-spacing:-.5px; }
        .confirm-btn { border-radius:12px; padding:14px; }
        @media (max-width:900px) {
            #app { width:100%; height:100dvh; border-radius:0; border:0; }
            #sidebar { width:245px; padding:22px 15px; }
            #room-header { min-height:68px; padding:17px 20px; }
            #chat { padding:22px 18px; }
        }
        @media (max-width:620px) {
            body,html { display:block; overflow:hidden; }
            #app { display:flex; flex-direction:column; height:100dvh; min-height:0; }
            #sidebar { width:100%; flex:0 0 auto; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
                gap:9px; padding:12px 14px; border-right:0; border-bottom:1px solid var(--line-soft); }
            #sidebar h2 { grid-column:1/-1; font-size:20px; margin:0; }
            #sidebar h2:before { height:20px; width:6px; }
            .input-group { grid-column:1/-1; display:flex; flex-direction:row; align-items:center; gap:10px; }
            .input-group label { flex:0 0 66px; }
            #sidebar input { padding:10px 12px; }
            #sidebar hr { display:none; }
            #sidebar button { padding:10px 8px; font-size:12px; }
            #recent-rooms-container { display:none; }
            #status-display { grid-column:1/-1; margin-top:0; padding:7px 10px; font-size:10px; }
            #chat-area { flex:1; min-height:0; }
            #room-header { min-height:56px; padding:13px 16px; font-size:16px; }
            #chat { padding:17px 13px; gap:11px; }
            .message { max-width:88%; padding:11px 13px; font-size:13px; }
            #typing-indicator { padding-left:16px; height:20px; }
            #input-area { padding:10px 10px max(12px,env(safe-area-inset-bottom)); gap:7px; }
            #message-input { padding:13px 13px; font-size:14px; }
            .action-btn { width:42px; height:42px; border-radius:13px; }
            #sendBtn { min-width:64px; height:42px; padding:0 13px; }
            .modal-content { padding:24px 20px; }
        }
        @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; animation:none!important; } }
    </style>
</head>
<body>

<div id="app">
    <div id="sidebar">
        <h2>𝕄𝕔ℂ𝕣𝕒𝕔𝕜</h2>
        <div class="input-group">
            <label>USERNAME</label>
            <input id="user-display-name" placeholder="Enter name...">
        </div>
        <hr style="border: 0; border-top: 1px solid #222; margin: 10px 0;">
        <button id="createBtn">Create New Room</button>
        <button id="joinBtn">Join Room</button>
        
        <div id="recent-rooms-container">
            <div id="recent-rooms-header">
                <label style='font-size:10px; color:#555; font-weight:bold;'>MY ROOMS</label>
                <span onclick="clearRecentRooms()" style="font-size:10px; color:#f44; cursor:pointer;">CLEAR</span>
            </div>
            <div id="recent-rooms-list"></div>
        </div>

        <div id="status-display" class="status-offline">System: Connecting...</div>
    </div>
    
    <div id="chat-area">
        <div id="room-header">Welcome to 𝕄𝕔ℂ𝕣𝕒𝕔𝕜 Chat</div>
        <div id="chat"></div>
        <div id="typing-indicator"></div>
        <div id="input-area">
            <input type="file" id="fileInput" accept="image/*" style="display:none">
            <button class="action-btn" id="uploadBtn" disabled>+</button>
            <input id="message-input" placeholder="Join a room..." disabled>
            <button id="sendBtn" disabled>Send</button>
        </div>
    </div>
</div>

<div id="room-modal" class="modal">
    <div class="modal-content">
        <h3 id="modal-title" style="color:#fff">Room</h3>
        <input id="room-name-input" placeholder="Room name...">
        <button id="confirmRoomBtn" class="confirm-btn">Confirm & Enter</button>
        <button onclick="closeModal()" style="background:transparent; color:#555; border:none; cursor:pointer;">Cancel</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = "https://agcrweayleevlkgcmqpy.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFnY3J3ZWF5bGVldmxrZ2NtcXB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1MzI5ODcsImV4cCI6MjA4NzEwODk4N30.6ROZmRjDORSrfHP9yeZ_ofRHueHnq5K-C9c_jjxqBwQ";
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let activeRoom = "";
    let myUsername = "";
    let chatChannel = null;
    let typingTimeout = null;

    const chatBox = document.getElementById("chat");
    const msgInput = document.getElementById("message-input");
    const sendBtn = document.getElementById("sendBtn");
    const uploadBtn = document.getElementById("uploadBtn");
    const fileInput = document.getElementById("fileInput");
    const statusDisplay = document.getElementById("status-display");
    const roomModal = document.getElementById("room-modal");
    const roomInput = document.getElementById("room-name-input");
    const nameInput = document.getElementById("user-display-name");
    const recentRoomsList = document.getElementById("recent-rooms-list");
    const typingIndicator = document.getElementById("typing-indicator");

    function renderRecentRooms() {
        const savedRooms = JSON.parse(localStorage.getItem("myRooms") || "[]");
        recentRoomsList.innerHTML = "";
        savedRooms.forEach(roomName => {
            const btn = document.createElement("button");
            btn.className = "room-history-btn";
            btn.innerText = "# " + roomName;
            btn.onclick = () => {
                roomInput.value = roomName;
                if (nameInput.value.trim() !== "") {
                    window.modalMode = "join";
                    document.getElementById("confirmRoomBtn").click();
                } else {
                    openModal("Join Room", "join");
                    roomInput.value = roomName;
                }
            };
            recentRoomsList.appendChild(btn);
        });
    }

    function saveRoomLocally(roomName) {
        let savedRooms = JSON.parse(localStorage.getItem("myRooms") || "[]");
        savedRooms = savedRooms.filter(r => r !== roomName);
        savedRooms.unshift(roomName);
        if(savedRooms.length > 5) savedRooms.pop();
        localStorage.setItem("myRooms", JSON.stringify(savedRooms));
        renderRecentRooms();
    }

    function clearRecentRooms() { localStorage.removeItem("myRooms"); renderRecentRooms(); }

    renderRecentRooms();

    async function checkSystem() {
        try {
            const { error } = await _supabase.from('rooms').select('name').limit(1);
            if(!error) {
                statusDisplay.innerText = "System: Online";
                statusDisplay.className = "status-online";
            }
        } catch (e) { statusDisplay.className = "status-offline"; }
    }
    checkSystem();

    function openModal(title, mode) {
        window.modalMode = mode;
        document.getElementById("modal-title").innerText = title;
        roomModal.style.display = "flex";
        roomInput.focus();
    }

    function closeModal() { roomModal.style.display = "none"; roomInput.value = ""; }

    document.getElementById("createBtn").onclick = () => openModal("Create Room", "create");
    document.getElementById("joinBtn").onclick = () => openModal("Join Room", "join");

    document.getElementById("confirmRoomBtn").onclick = async () => {
        const r = roomInput.value.trim().toLowerCase();
        const u = nameInput.value.trim();
        if(!r || !u) return;

        try {
            if (window.modalMode === "create") {
                await _supabase.from('rooms').insert([{ name: r }]);
            } else {
                const { data } = await _supabase.from('rooms').select('*').eq('name', r).maybeSingle();
                if (!data) { alert("Room not found!"); return; }
            }
            saveRoomLocally(r);
            activeRoom = r;
            myUsername = u;
            document.getElementById("room-header").innerText = "# " + r;
            msgInput.disabled = false;
            sendBtn.disabled = false;
            uploadBtn.disabled = false;
            closeModal();
            connectToRoom();
        } catch (err) { alert("Error: " + err.message); }
    };

    async function connectToRoom() {
        chatBox.innerHTML = "<p style='text-align:center; opacity:0.3; margin-top:20px;'>Syncing...</p>";
        const { data } = await _supabase.from("messages").select("*").eq("room", activeRoom).order("created_at", { ascending: true });
        chatBox.innerHTML = "";
        if (data) data.forEach(msg => addMessage(msg));

        if(chatChannel) await _supabase.removeChannel(chatChannel);
        
        chatChannel = _supabase.channel(`room_${activeRoom}`)
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `room=eq.${activeRoom}` }, 
                payload => addMessage(payload.new)
            )
            .on('broadcast', { event: 'typing' }, payload => {
                if (payload.payload.user !== myUsername) {
                    typingIndicator.innerText = `${payload.payload.user} is typing...`;
                    clearTimeout(typingTimeout);
                    typingTimeout = setTimeout(() => { typingIndicator.innerText = ""; }, 2000);
                }
            })
            .subscribe();
    }

    function addMessage(msg) {
        // Ignore malformed realtime payloads and render all user-provided text safely.
        if (!msg || typeof msg.content !== "string") return;
        const div = document.createElement("div");
        const isMe = msg.username === myUsername;
        div.className = `message ${isMe ? "mine" : ""}`;
        const info = document.createElement("span");
        info.className = "msg-info";
        info.textContent = String(msg.username || "Guest").slice(0, 40);
        div.appendChild(info);

        const content = msg.content;
        let parsedUrl = null;
        try { parsedUrl = new URL(content); } catch (_) {}
        const imageLike = parsedUrl && parsedUrl.protocol === "https:" &&
            (/\.(png|jpe?g|gif|webp|avif)(?:$|\?)/i.test(parsedUrl.href) ||
             parsedUrl.hostname === "agcrweayleevlkgcmqpy.supabase.co" && parsedUrl.pathname.includes("/storage/v1/object/public/chat-images/"));
        if (imageLike) {
            const img = document.createElement("img");
            img.src = parsedUrl.href;
            img.alt = "Image shared in chat";
            img.loading = "lazy";
            img.className = "chat-img";
            img.tabIndex = 0;
            img.addEventListener("click", () => window.open(parsedUrl.href, "_blank", "noopener,noreferrer"));
            img.addEventListener("keydown", e => { if (e.key === "Enter") window.open(parsedUrl.href, "_blank", "noopener,noreferrer"); });
            div.appendChild(img);
        } else {
            const body = document.createElement("span");
            body.textContent = content;
            div.appendChild(body);
            const urlMatch = content.match(/https?:\/\/[^\s]+/);
            if (urlMatch) {
                const link = document.createElement("a");
                link.href = urlMatch[0];
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = " Open link";
                link.style.cssText = "display:inline-block;margin-left:6px;color:inherit;text-decoration:underline;opacity:.8";
                div.appendChild(link);
            }
        }
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Typing Event Trigger
    msgInput.oninput = () => {
        if (chatChannel) {
            chatChannel.send({
                type: 'broadcast',
                event: 'typing',
                payload: { user: myUsername }
            });
        }
    };

    // Upload functionality
    uploadBtn.onclick = () => fileInput.click();
    fileInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        uploadBtn.innerText = "...";
        const fileExt = file.name.split('.').pop();
        const fileName = `${Math.random()}.${fileExt}`;
        const filePath = `${activeRoom}/${fileName}`;

        try {
            const { data, error } = await _supabase.storage
                .from('chat-images')
                .upload(filePath, file);

            if (error) throw error;

            const { data: urlData } = _supabase.storage
                .from('chat-images')
                .getPublicUrl(filePath);

            await _supabase.from("messages").insert([{ 
                room: activeRoom, 
                username: myUsername, 
                content: urlData.publicUrl 
            }]);
        } catch (err) {
            alert("Upload failed: " + err.message);
        } finally {
            uploadBtn.innerText = "+";
            fileInput.value = "";
        }
    };

    async function send() {
        const text = msgInput.value.trim();
        if(!text) return;
        msgInput.value = "";
        await _supabase.from("messages").insert([{ room: activeRoom, username: myUsername, content: text }]);
    }

    sendBtn.onclick = send;
    msgInput.onkeypress = (e) => { if(e.key === "Enter") send(); };
</script>
</body>
</html>
